<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="container">
      <div class="result">
        <h3 class="result__title">Your Result</h3>
        <div class="result__digits">
          <h2 class="result__digits_score">76</h2>
          <p class="result__digits_100">of 100</p>
        </div>
        <div class="feedback">
          <h2 class="result__feedback_great">Great</h2>
          <p class="result__feedback_desc">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </div>
      <div class="summary">
        <h3>Summary</h3>
        <div class="summary__cell clr--bg-red">
          <img class="summary__cell_img" src="/iconoir_flash.png" alt="" />
          <p>Reaction</p>
          <p><span>80</span>/100</p>
        </div>
        <div class="summary__cell clr--bg-yellow">
          <img class="/summary__cell_img" src="/iconoir_brain.svg" alt="" />
          <p>Memory</p>
          <p><span>92</span>/100</p>
        </div>
        <div class="summary__cell clr--bg-green">
          <img src="/Vector.png" alt="" />
          <p>Verbal</p>
          <p><span>61</span>/100</p>
        </div>
        <div class="summary__cell clr--bg-blue">
          <img src="/Group.png" alt="" />
          <p>Visual</p>
          <p><span>73</span>/100</p>
        </div>
        <button class="btn">Continue</button>
      </div>
    </section>
  </body>
</html>
