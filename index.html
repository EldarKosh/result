<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="container">
      <div class="result">
        <h3 class="result__title">Your Result</h3>
        <div class="result__digits">
          <h2 class="result__digits_score">76</h2>
          <p class="result__digits_100">of 100</p>
        </div>
        <div class="feedback container">
          <h2 class="result__feedback_great">Great</h2>
          <p class="result__feedback_desc">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
      </div>
      <div class="summary">
        <h3>Summary</h3>
        <div class="summary__cell summary__cell_r">
          <img class="summary__cell_img" src="/iconoir_flash.png" alt="" />
          <h2>Reaction</h2>
          <div>
            <h2 class="summary__cell_n">80</h2>
            <h2 class="summary__cell_100">/ 100</h2>
          </div>
        </div>
        <div class="summary__cell summary__cell_m">
            <img class="/summary__cell_img" src="/iconoir_brain.svg" alt="">
          <h2>Memory</h2>
          <div>
            <h2 class="summary__cell_n">92</h2>
            <h2 class="summary__cell_100">/ 100</h2>
          </div>
        </div>
        <div class="summary__cell summary__cell_v">
            <img src="/Vector.png" alt="">
          <h2>Verbal</h2>
          <div>
            <h2 class="summary__cell_n">61</h2>
            <h2 class="summary__cell_100">/ 100</h2>
          </div>
        </div>
        <div class="summary__cell summary__cell_vs">
            <img src="/Group.png" alt="">
          <h2>Visual</h2>
          <div>
            <h2 class="summary__cell_n">73</h2>
            <h2 class="summary__cell_100">/100</h2>
          </div>
        </div>
        <button class="btn">Continue</button>
      </div>
    </section>
  </body>
</html>
